output_model_name: lehwm
subdir: smoketest
num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3
'n': 4
embed_dim_1: 96
m_dim: 32
history_size_1: 1
action_dim: ???
num_preds: ${n}
lewm_weights: ~/.stable_worldmodel/checkpoints/quentinll/lewm-cube/weights.pt
trainer:
  max_epochs: 1
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  limit_train_batches: 60
  limit_val_batches: 5
loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
optimizer:
  type: AdamW
  lr: 0.0003
  weight_decay: 0.001
loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  kl:
    weight: 0.01
    warmup_steps: 5000
    free_bits: 0.0
  cons:
    weight: 1.0
  skill:
    weight: 1.0
wandb:
  enabled: false
  config:
    entity: lewm
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: false
data:
  dataset:
    name: ogbench/cube_single_expert.h5
    num_steps: ${eval:'${num_preds} + ${history_size}'}
    frameskip: 5
    keys_to_load:
    - pixels
    - action
    - observation
    keys_to_cache:
    - action
    - observation
    keys_to_merge:
      proprio: proprio
model:
  _target_: hjepa.HJEPA
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: tiny
    patch_size: 14
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: module.ARPredictor
    num_frames: ${history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: module.Embedder
    input_dim: ${action_dim}
    emb_dim: ${embed_dim}
  projector:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  elevator:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim_1}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  posterior:
    _target_: module.Posterior
    input_dim: ${embed_dim_1}
    hidden_dim: 512
    m_dim: ${m_dim}
  predictor1:
    _target_: module.ARPredictor
    num_frames: ${history_size_1}
    input_dim: ${embed_dim_1}
    hidden_dim: 256
    output_dim: ${embed_dim_1}
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 32
    dropout: 0.1
    emb_dropout: 0.0
  pi:
    _target_: module.MLP
    input_dim: ${eval:'${embed_dim} + ${m_dim}'}
    output_dim: ${eval:'${action_dim} * ${n}'}
    hidden_dim: 1024
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  m_encoder:
    _target_: module.Embedder
    input_dim: ${m_dim}
    emb_dim: ${embed_dim_1}
  pred_proj1:
    _target_: module.MLP
    input_dim: ${embed_dim_1}
    output_dim: ${embed_dim_1}
    hidden_dim: 512
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
