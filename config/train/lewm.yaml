defaults:
  - _self_
  - launcher: local
  - data: ogb
  - model: lewm

exp: ${now:%Y-%m-%d_%H-%M-%S}    # python train.py exp=mon_exp seed=42  (puis 43, 44)
name: ${exp}/seed${seed}          # dossier du run : results/<exp>/seed<seed> (lu par benchmark.py)
hydra:
  run:
    dir: results/${name}

num_workers: 6
seed: 42              # protocole H-JEPA : seeds 42 / 43 / 44, LeWM gelé de même seed
img_size: 224
embed_dim: 192
history_size: 3

# level 1

n: 4                  # number of steps predicted by predictor1
embed_dim_1: 96       # dim of the embedding after the elevator (D_1)
m_dim: 32             # dim of the latent variable m
history_size_1: 1     # level 1 markov TODO: upgrade
action_dim: ???       # read on config.json

# IMPORTANT : la longueur des séquences du dataset (dans la config data)
# doit valoir history_size + n = 7 frames.


num_preds: ${n}
# Niveau 0 gelé = LeWM du papier H-JEPA (entraîné sur le split train seulement), voir README
hjepa_home: ${oc.env:HJEPA_HOME,${oc.env:HOME}/hjepa_home}
lewm_ckpt_dir: ${hjepa_home}/ckpts/cube/cube_lewm/seed${seed}
lewm_weights: ${lewm_ckpt_dir}/lewm_state_dict.pt   # python convert_lewm.py <dir>/cube_lewm_object.ckpt
lewm_normalizer: ${lewm_ckpt_dir}/normalizer.pt

trainer:
  max_epochs: 8        # budget d'epochs H-JEPA sur cube (Table 4)
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 3e-4 # TODO: tune this hyperparameter
  weight_decay: 1e-3


loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  kl:
    weight: 0.01 # TODO: tune this hyperparameter
    warmup_steps: 5000               # annealing 0 -> weight
    free_bits: 0.0                   # ex. 0.1–0.5 si posterior collapse
  cons:
    weight: 1.0                      # manquait
  skill:
    weight: 0.1
