defaults:
  - _self_
  - launcher: local
  - data: ogb
  - model: lewm

name: ${now:%Y-%m-%d_%H-%M-%S}   # dossier du run : results/<name>  (python train.py name=mon_run)
hydra:
  run:
    dir: results/${name}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

# level 1

n: 4                  # number of steps predicted by predictor1
embed_dim_1: 96       # dim of the embedding after the elevator (D_1)
m_dim: 32             # dim of the latent variable m
history_size_1: 1     # level 1 markov TODO: upgrade
action_dim: ???       # read on config.json

# IMPORTANT : la longueur des séquences du dataset (dans la config data)
# doit valoir history_size + n = 7 frames.


num_preds: ${n}
lewm_weights: ~/.stable_worldmodel/checkpoints/quentinll/lewm-cube/weights.pt  # hf download quentinll/lewm-cube

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 3e-4 # TODO: tune this hyperparameter
  weight_decay: 1e-3


loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  kl:
    weight: 0.01 # TODO: tune this hyperparameter
    warmup_steps: 5000               # annealing 0 -> weight
    free_bits: 0.0                   # ex. 0.1–0.5 si posterior collapse
  cons:
    weight: 1.0                      # manquait
  skill:
    weight: 0.1
